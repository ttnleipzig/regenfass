name: Sketch - release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: write

jobs:
  environments:
    name: Discover PlatformIO environments
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.environments.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
      - name: Read PlatformIO environments
        id: environments
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          environments = re.findall(r"^\[env:([^\]]+)\]", Path("firmware/platformio.ini").read_text(), re.MULTILINE)
          if not environments:
              raise SystemExit("No PlatformIO environments found")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"environments={json.dumps(environments)}\n")
          PYTHON

  # ─────────────────────────────────────────────────────────────────────────
  # Build all firmware environments in parallel.
  # fail-fast: false keeps other boards building even if one fails.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    needs: environments
    name: 🏗️ Build [${{ matrix.environment }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.environments.outputs.environments) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.environment }}-
            ${{ runner.os }}-pio-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run -e ${{ matrix.environment }}

      - name: List build output
        working-directory: firmware
        run: ls -lR .pio/build/${{ matrix.environment }}/

      - name: Package firmware archive
        env:
          SKIP_BUILD: "1"
          BASENAME_PATHS: "1"
          OUT_DIR: dist
        run: |
          bash firmware/scripts/package_firmware.sh "${{ matrix.environment }}"
          cp "firmware/.pio/build/${{ matrix.environment }}/firmware.bin" firmware/dist/firmware.bin
          test -s "firmware/dist/firmware-${{ matrix.environment }}.zip"
          test -s firmware/dist/firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          # Keep both files in one directory so downloads have a flat layout.
          path: |
            firmware/dist/firmware-${{ matrix.environment }}.zip
            firmware/dist/firmware.bin
          if-no-files-found: error
          compression-level: 8

  # ─────────────────────────────────────────────────────────────────────────
  # Release Please runs independently; it does not need the build to finish.
  # It opens / merges release PRs and, when a release PR is merged, creates
  # the GitHub Release and tag.
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: 📦 Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          # Use the built-in GITHUB_TOKEN; it already has contents:write
          # and pull-requests:write from the top-level permissions block.
          token: ${{ github.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: steps.release.outputs.release_created == 'true'
        run: echo "Release created → ${{ steps.release.outputs.tag_name }}"

  # ─────────────────────────────────────────────────────────────────────────
  # Upload firmware binaries to the GitHub Release.
  #
  # Waits for both build and release to complete.
  # Uses `always()` so that partial build failures (fail-fast: false) do not
  # prevent uploading the environments that did succeed.
  # Individual download steps use continue-on-error to skip environments
  # whose build failed without failing the whole upload job.
  # ─────────────────────────────────────────────────────────────────────────
  upload:
    name: 💾 Upload [${{ matrix.environment }}]
    runs-on: ubuntu-latest
    needs: [environments, build, release]
    # Run whenever a release was created, even if some build matrix items failed.
    if: >-
      always() &&
      needs.release.result == 'success' &&
      needs.release.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.environments.outputs.environments) }}
    steps:
      - name: Download firmware artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: firmware-dist

      - name: Rename firmware archive
        if: steps.download.outcome == 'success'
        run: |
          mv "firmware-dist/firmware-${{ matrix.environment }}.zip" \
            "regenfass-${{ needs.release.outputs.tag_name }}-${{ matrix.environment }}.zip"

      - name: Upload assets to GitHub Release
        if: steps.download.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.tag_name }}"
          ENV="${{ matrix.environment }}"
          FILES=()

          # Upload the main application binary with a descriptive name.
          if [ -f "firmware-dist/firmware.bin" ]; then
            FILES+=("firmware-dist/firmware.bin#regenfass-${TAG}-${ENV}.bin")
          fi

          # Include the full-flash ZIP with binaries and firmware_metadata.json.
          FILES+=("regenfass-${TAG}-${ENV}.zip")

          gh release upload "${TAG}" \
            "${FILES[@]}" \
            --repo "${{ github.repository }}" \
            --clobber

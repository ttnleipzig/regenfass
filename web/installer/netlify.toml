# Prefer GitHub Actions for builds (see .github/workflows/web-deploy-netlify.yml).
# Keep Base directory empty (repository root) if this site is linked in Netlify UI.
# `ignore = "exit 0"` skips Netlify’s own builder so deploys come from GHA via netlify-cli.
[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ttnleipzig/regenfass-installer build"
  publish = "web/installer/dist"
  ignore = "exit 0"

[functions]
  directory = "web/installer/netlify/functions"

[[redirects]]
  from = "/firmware/:version/:environment"
  to = "/.netlify/functions/firmware?version=:version&environment=:environment"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
